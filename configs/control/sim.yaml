# 控制参数（MuJoCo 仿真，场景 configs/scene/sim_floor.yaml：抓取区和塔都在地面上）。
# 长度单位 m，角度单位 rad，坐标都在机械臂基座坐标系（x 向前，y 向左，z 向上）。

# 抓取扫描位姿：夹爪在抓取区上方，相机看着抓取区
pick_joint: AUTO        # 抓取扫描位姿的关节角；AUTO 为由下面的位姿逆解得到
pick_position_x: 0.25
pick_position_y: 0.0
pick_position_z: -0.435
pick_roll: 0
pick_pitch: 1.570796    # 夹爪竖直向下
pick_yaw: 0
pick_grasp_z: -0.460    # 下抓时指尖（末端点）的高度：离地 15 mm（地面在 −0.475，即 configs/scene/sim_floor.yaml 的桌高）

# 放置位置（塔的位置）
place_position_x: 0.2121
place_position_y: -0.2121
place_position_z: pick_grasp_z  # 第一层的松开高度，第 k 层再加 k 个 cube_height；pick_grasp_z 表示和抓取高度相同
place_roll: pick_roll
place_pitch: pick_pitch
place_yaw: pick_yaw

cube_height: 0.025

# 抓起后横移时末端的最低高度：pick_grasp_z + cube_height + 0.01，手里的物块越过抓取区的其他物块
# （只在用规划场景，即 pick-place 加 scene 时起作用）
transit_z_min: -0.425

# 跟踪范围限位：视觉跟踪时末端的 xy 只能在这个矩形内，防止锁定抓取区外或塔上的同色物块。
# 半边长 = 抓取区半边长 + 3 cm。腕部相机在扫描位姿只看得到夹爪前方，仿真的抓取区（configs/scene/sim_floor.yaml
# 的 pick_area）因此放在扫描点 (0.25, 0) 前方，中心是 (0.29, 0.015)，矩形的中心也设在那里
pick_area_center: [0.29, 0.015]
pick_area_half_size: [0.065, 0.105]
place_track_half_size: [0.02, 0.02]  # Place 阶段矩形的半边长，以 place_position_x/y 为中心

# 以下是可选项，不写时用括号里的缺省值
# gap_place: 0.003        # 调节时手里物块的底面比塔顶高出的距离（0.003）
# place_settle_time: 3.0  # 到塔上方后停稳的时间（s），第 1 块松开前、之后开始视觉调节前都等这么久（不写时和原来一样：第 1 块 1 s，之后 3 s）
# place_retreat_y: 0.075  # 只在用规划场景时：松开、竖直上升后沿 y 侧移的距离，方向自动取朝抓取区的一侧（0，不侧移，只靠规划场景绕开塔）
# out_of_area_frames: 10  # 连续多少帧超出跟踪范围后，回扫描位姿（Pick）或停下报错（Place）（10，约 0.3 s）
