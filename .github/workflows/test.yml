name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # Unit tests and the arm-driver contract tests (headless MuJoCo simulation and a fake
    # airbot_server). No ROS master, no rendering, no catkin build needed.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Install pixi
        run: |
          curl -fsSL https://pixi.sh/install.sh | bash
          echo "$HOME/.pixi/bin" >> "$GITHUB_PATH"
      - name: Install the environment
        run: pixi install --locked
      - name: Code style
        run: pixi run lint
      - name: Tests
        run: pixi run test
